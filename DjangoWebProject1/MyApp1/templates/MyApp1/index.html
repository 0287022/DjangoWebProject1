<html>
<head><title></title></head>

<body>

    <strong>Teachers</strong>
    {% if content %}
    <table>
        <tr>
            <th>Name</th>
            <th>Teaching Area</th>
        </tr>
        {% for teach in content %}
        <tr>
            <td>{{ teach.Name }}</td>
            <td>{{ teach.Area }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <strong>Data not found.</strong>
    {% endif %}
    <p><a href="/input">sign up!</a></p>
    <p><a href="/generate">generate!</a></p>
    <p><a href="/dropdown">dropdown!</a></p>
    <p><a href="{% url 'report'%}">PDF report</a></p>
</body>
</html>
