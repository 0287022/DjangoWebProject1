<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <form method="post" id="personForm" data-cities-url="{% url 'ajax_load_courses' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script>
        $("#id_courseArea").change(function () {
            const url = $("#OutlineForm").attr("data-courses-url");
            const courseID = $(this).val(); 
            $.ajax({ 
                url: url,
                data: {
                    'course_id': courseID
                },
                success: function (data) {
                    $("#id_course").html(data);
                }
            });
        });
    </script>
</body>
</html>
